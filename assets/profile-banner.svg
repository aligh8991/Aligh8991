<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Ali G. profile banner</title><desc id="desc">A dark burgundy and charcoal banner for a front-end developer, music producer, and translator.</desc>
